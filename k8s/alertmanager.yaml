apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: darviq-buzz
data:
  alertmanager.yml: |
    route:
      receiver: "default"
      group_by: ["alertname", "service"]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
    receivers:
      - name: "default"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: darviq-buzz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:latest
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 200m, memory: 256Mi}
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: darviq-buzz
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
      nodePort: 30093
  type: NodePort
