apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: darviq-buzz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      # Mitigates a confirmed live issue: glibc's parallel A/AAAA DNS
      # queries occasionally race under load, one leg silently drops,
      # and the resolver falls through to a bare unqualified query that
      # CoreDNS can't handle and forwards upstream, timing out. This is
      # the standard Kubernetes-documented mitigation.
      dnsConfig:
        options:
          - name: single-request-reopen
      containers:
        - name: notification-service
          image: localhost:5050/darviq-buzz-notification-service:build-3
          ports:
            - containerPort: 5008
          env:
            - {name: PORT, value: "5008"}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: buzz-secrets, key: NOTIFICATION_DATABASE_URL}}
            - name: RABBITMQ_URL
              valueFrom: {secretKeyRef: {name: buzz-secrets, key: RABBITMQ_URL}}
          readinessProbe:
            httpGet: {path: /ready, port: 5008}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 5008}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 200m, memory: 192Mi}
