# Readiness checks /ready (RabbitMQ connection), not /health -- see
# services/feed-service/consumer.py / app.py.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-service
  namespace: darviq-buzz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feed-service
  template:
    metadata:
      labels:
        app: feed-service
    spec:
      # Mitigates a confirmed live issue: glibc's parallel A/AAAA DNS
      # queries occasionally race under load, one leg silently drops,
      # and the resolver falls through to a bare unqualified query that
      # CoreDNS can't handle and forwards upstream, timing out. This is
      # the standard Kubernetes-documented mitigation.
      dnsConfig:
        options:
          - name: single-request-reopen
      containers:
        - name: feed-service
          image: localhost:5050/darviq-buzz-feed-service:build-4
          ports:
            - containerPort: 5007
          env:
            - {name: PORT, value: "5007"}
            - {name: CASSANDRA_CONTACT_POINTS, value: "cassandra"}
            - {name: CQLENG_ALLOW_SCHEMA_MANAGEMENT, value: "1"}
            - {name: SOCIAL_GRAPH_SERVICE_URL, value: "http://social-graph-service:5002"}
            - name: RABBITMQ_URL
              valueFrom: {secretKeyRef: {name: buzz-secrets, key: RABBITMQ_URL}}
          readinessProbe:
            httpGet: {path: /ready, port: 5007}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 5007}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 200m, memory: 192Mi}
