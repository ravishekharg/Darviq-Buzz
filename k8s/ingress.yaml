# Assumes ingress-nginx is already installed on the homelab kind cluster. Add
# "127.0.0.1 darviq-buzz.homelab.local" to your hosts file.
#
# web-bff is the actual app (real server-rendered pages); gateway is the
# external-facing JSON API for a future mobile client. Both are exposed;
# every other service is internal-only (see network-policies.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: darviq-buzz
  namespace: darviq-buzz
spec:
  ingressClassName: nginx
  rules:
    - host: darviq-buzz.homelab.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-bff
                port:
                  number: 5010
