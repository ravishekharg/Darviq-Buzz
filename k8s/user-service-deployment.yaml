apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: darviq-buzz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      # Mitigates a confirmed live issue: glibc's parallel A/AAAA DNS
      # queries occasionally race under load, one leg silently drops,
      # and the resolver falls through to a bare unqualified query that
      # CoreDNS can't handle and forwards upstream, timing out. This is
      # the standard Kubernetes-documented mitigation.
      dnsConfig:
        options:
          - name: single-request-reopen
      containers:
        - name: user-service
          image: localhost:5050/darviq-buzz-user-service:build-6
          ports:
            - containerPort: 5001
          env:
            - {name: PORT, value: "5001"}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: buzz-secrets, key: USER_DATABASE_URL}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: buzz-secrets, key: JWT_SECRET}}
          readinessProbe:
            httpGet: {path: /health, port: 5001}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 5001}
            initialDelaySeconds: 15
            periodSeconds: 20
          # Unlike every other service here, this one runs bcrypt (12 rounds,
          # deliberately CPU-hard by design) on every register/login call.
          # Measured directly in this container: a single hash took 2.2s
          # under the previous 200m limit -- CFS throttling a CPU-bound
          # crypto workload to a fifth of a core, independent of whatever
          # headroom the node otherwise has. 1000m removes that ceiling.
          resources:
            requests: {cpu: 200m, memory: 96Mi}
            limits: {cpu: 1000m, memory: 192Mi}
