apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-uploads
  namespace: darviq-buzz
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: darviq-buzz
spec:
  replicas: 1
  strategy:
    type: Recreate # single ReadWriteOnce uploads volume
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
    spec:
      # Mitigates a confirmed live issue: glibc's parallel A/AAAA DNS
      # queries occasionally race under load, one leg silently drops,
      # and the resolver falls through to a bare unqualified query that
      # CoreDNS can't handle and forwards upstream, timing out. This is
      # the standard Kubernetes-documented mitigation.
      dnsConfig:
        options:
          - name: single-request-reopen
      containers:
        - name: media-service
          image: localhost:5050/darviq-buzz-media-service:build-3
          ports:
            - containerPort: 5009
          env:
            - {name: PORT, value: "5009"}
            - {name: S3_BUCKET_NAME, value: "darviq-social-media-assets"}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: buzz-secrets, key: MEDIA_DATABASE_URL}}
          volumeMounts:
            - name: uploads
              mountPath: /app/static/uploads
          readinessProbe:
            httpGet: {path: /health, port: 5009}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 5009}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 200m, memory: 192Mi}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: media-uploads
