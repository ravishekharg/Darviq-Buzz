global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

# Static targets, not service discovery -- this is a docker-compose stack,
# not k8s, so every service's fixed compose DNS name + port is scraped
# directly. All 11 services expose /metrics (Prometheus format,
# prometheus_client) via their metrics.py.
scrape_configs:
  - job_name: gateway
    static_configs: [{targets: ["gateway:5000"]}]
  - job_name: user-service
    static_configs: [{targets: ["user-service:5001"]}]
  - job_name: social-graph-service
    static_configs: [{targets: ["social-graph-service:5002"]}]
  - job_name: post-service
    static_configs: [{targets: ["post-service:5003"]}]
  - job_name: engagement-service
    static_configs: [{targets: ["engagement-service:5004"]}]
  - job_name: story-service
    static_configs: [{targets: ["story-service:5005"]}]
  - job_name: messaging-service
    static_configs: [{targets: ["messaging-service:5006"]}]
  - job_name: feed-service
    static_configs: [{targets: ["feed-service:5007"]}]
  - job_name: notification-service
    static_configs: [{targets: ["notification-service:5008"]}]
  - job_name: media-service
    static_configs: [{targets: ["media-service:5009"]}]
  - job_name: web-bff
    static_configs: [{targets: ["web-bff:5010"]}]
